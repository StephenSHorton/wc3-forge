name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    # Cap Go build/compile parallelism. `go test ./...` otherwise fans out one
    # compiler per core; the wails/webview2/casc dependency tree then reserves
    # enough address space across those concurrent processes to blow the
    # windows-latest commitment limit (errno=1455 / "out of memory allocating
    # heap arena map"). -p=2 halves the concurrent compiles; combined with the
    # enlarged pagefile below this keeps the suite under the runner's limit.
    env:
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v6

      # Enlarge the Windows pagefile so the Go compiler's large address-space
      # reservations don't hit ERROR_COMMITMENT_LIMIT (errno=1455) on the
      # memory-constrained windows-latest runner. Pinned to the v1.4 commit.
      - name: Configure pagefile
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 8GB
          maximum-size: 16GB

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend type-check
        working-directory: frontend
        run: npm run check

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      # The MCP catalog (internal/mcpserver/tools.json) is generated from
      # mcp/src/tools.ts. Regenerate it and fail if it differs from what's
      # committed, so a tools.ts edit that wasn't followed by `npm run gen:tools`
      # can't merge with a stale catalog. The Go TestToolsCatalogParity test
      # separately enforces handler↔catalog 1:1 correspondence.
      - name: MCP catalog in sync (gen:tools, fail on drift)
        shell: bash
        run: |
          set -eo pipefail
          cd mcp && npm ci && npm run gen:tools && cd ..
          # --exit-code, not --exit-status: Git for Windows on windows-2025
          # rejects --exit-status as an invalid option and this step then
          # falsely reports catalog drift.
          if ! git diff --exit-code internal/mcpserver/tools.json; then
            echo "::error::internal/mcpserver/tools.json is out of sync with mcp/src/tools.ts. Run 'cd mcp && npm run gen:tools' and commit the result."
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Go build
        run: go build ./...

  # macOS leg: compile + test the darwin/unix Go paths (casc_unix.go,
  # liveness_unix.go, launch_darwin.go, wc3path_other.go, update_run_other.go,
  # asset_handler_darwin.go) that the Windows job never builds. There's no macOS
  # release artifact, so this is purely a compile/lint/test gate — no wails build.
  # It still builds the frontend because the root package embeds frontend/dist
  # (//go:embed all:frontend/dist), so `go build ./...` needs dist to exist.
  # CASC/WC3-dependent tests skip themselves when no install is present (the
  # casc_test.go t.Skipf guards), so `go test ./...` is green on a bare runner.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build the frontend so the root package's go:embed of frontend/dist
      # resolves (the binary itself isn't shipped from this leg).
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Go vet
        run: go vet ./...

      # Run the suite under the race detector here (the macOS leg) — it PROVES
      # the "two concurrent writers (GUI + MCP bridge) on one Session" safety bar
      # (e.g. TestSaveConcurrentMutation_NoRace), which count-only checks can't.
      # -race needs cgo + a C compiler; macОС runners ship clang, so CGO_ENABLED=1
      # works out of the box. We keep -race OFF the Windows leg: that runner is
      # memory-constrained (hence the -p=2 + pagefile mitigations above) and
      # -race ~doubles memory, risking the errno=1455 commit-limit OOM.
      - name: Go test (race detector)
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Go build
        run: go build ./...
